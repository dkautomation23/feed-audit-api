name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedaudit
          POSTGRES_PASSWORD: feedaudit
          POSTGRES_DB: feedaudit
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U feedaudit -d feedaudit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://feedaudit:feedaudit@localhost:5435/feedaudit_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+psycopg://feedaudit:feedaudit@localhost:5435/feedaudit
        run: alembic upgrade head && alembic check
      - name: Tests on Postgres, with coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: >-
          docker build
          --build-context engine=https://github.com/dkautomation23/feed-to-matrixify.git#b9692d938a94af9630ce0fc43cf162b182aaff7e
          -t feed-audit-api .
      - name: Start the stack and wait for both healthchecks
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
