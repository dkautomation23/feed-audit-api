[project]
name = "feed-audit-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI declares dependencies as default arguments

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S608"]
"scripts/*" = ["S311"]  # synthetic data, not cryptography

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
